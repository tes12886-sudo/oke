[project]
name = "mock-server"
version = "0.1.0"
description = "Mock Server Login"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "mangum>=0.17.0",
    "pycryptodome>=3.20.0",
    "blackboxprotobuf>=1.0.1",
    "httpx>=0.27.2",
    "upstash-redis>=1.2.3",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.vercel]
entrypoint = "api/index.py"
